[pytest]
testpaths = employee_app/tests
pythonpath = employee_app
addopts = --cov=employee_app --cov-report=term-missing --cov-report=html --alluredir=allure-results --allure-link-pattern=issue:https://brianjpaul02projectp1.atlassian.net/browse/{}
markers = 
    unit: Validates business logic in isolation using mocks.
    db: Tests database operations against temporary SQLite instances.
    api: Verify endpoint functionality, status codes, and validation.
    contract: Real HTTP API contracts using the live Flask server; exclude for fast feedback.
    e2e: Simulate complete user workflows through the UI.
    smoke: Critical happy-path workflows.
    negative: Validation failures and error handling paths.
    edge_case: Boundary and minor behavior checks.
    security: JWT, token, and role-based authorization tests.
    regression: Guards a specific fixed defect against returning.
filterwarnings =
    ignore:.*urllib3 v2 only supports OpenSSL.*

# To open the allure dashboard:
# allure serve allure-results

# To run tests with a specific marker, use:
# pytest -m <marker_name>
# Fast feedback suite (units, repositories, and existing journeys):
# pytest -m "not contract"
# Real HTTP API contract suite:
# pytest -m contract