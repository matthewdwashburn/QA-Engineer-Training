# CI-only overrides; compose.yaml stays as developers run it.
#   docker compose -f compose.yaml -f compose.ci.yaml up -d --wait

services:

  postgres:
    # Not published in CI: nothing outside the compose network talks to it, and
    # the agent may already have a Postgres on 5432.
    ports: !override []

  db-init:
    # Named for the registry at build time, so publishing is a push not a retag.
    image: ${REGISTRY:-ghcr.io/qea2026}/expense-db-init:${IMAGE_TAG:-dev}
    env_file: !reset []

  db-tools:
    # Same image as db-init: identical build, so compose builds it once.
    image: ${REGISTRY:-ghcr.io/qea2026}/expense-db-init:${IMAGE_TAG:-dev}

  employee-api:
    image: ${REGISTRY:-ghcr.io/qea2026}/expense-employee-api:${IMAGE_TAG:-dev}
    # !reset: the base env_file points at gitignored files absent in CI.
    env_file: !reset []
    environment:
      # `:?` fails fast and by name if Jenkins did not inject the credential.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (Jenkins credential jwt-secret)}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
    # !override: compose MERGES sequences, so the base port would survive too.
    ports: !override
      - "${EMPLOYEE_PORT:-5000}:5000"
    healthcheck:
      # python:3.12-slim has neither wget nor curl; urlopen raises on non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  manager-api:
    image: ${REGISTRY:-ghcr.io/qea2026}/expense-manager-api:${IMAGE_TAG:-dev}
    env_file: !reset []
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (Jenkins credential jwt-secret)}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}
    ports: !override
      - "${MANAGER_PORT:-7001}:7001"
    healthcheck:
      # busybox wget, confirmed present in the jlink runtime image.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7001/health"]
      interval: 5s
      timeout: 3s
      # JVM + Jetty is the slowest service to come up.
      retries: 20
      start_period: 15s

  frontend:
    image: ${REGISTRY:-ghcr.io/qea2026}/expense-frontend:${IMAGE_TAG:-dev}
    ports: !override
      - "${FRONTEND_PORT:-8080}:80"
    # service_healthy is what makes `up --wait` meaningful here.
    depends_on:
      employee-api:
        condition: service_healthy
      manager-api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 and nginx listens IPv4-only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
