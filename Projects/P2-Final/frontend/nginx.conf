server {
    listen 80;
    # IPv6 too, so `localhost` (which resolves to ::1 first) reaches nginx.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback -- the critical line
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so they can never go stale
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ...but index.html points AT those hashes, so it must never be cached
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Docker's embedded DNS. Resolving through a variable defers lookup to
    # request time -- with a literal host, nginx resolves at startup and exits
    # with "host not found in upstream" if an API is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # rewrite strips the prefix, since proxy_pass to a variable does not.
    location /api/employee/ {
        set $employee_upstream http://employee-api:5000;
        rewrite ^/api/employee/(.*)$ /$1 break;
        proxy_pass $employee_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/manager/ {
        set $manager_upstream http://manager-api:7001;
        rewrite ^/api/manager/(.*)$ /$1 break;
        proxy_pass $manager_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
