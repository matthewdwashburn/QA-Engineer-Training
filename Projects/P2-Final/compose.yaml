name: expense-manager

x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: ${POSTGRES_DB:-expense_manager}
  POSTGRES_USER: ${POSTGRES_USER:-expense}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}

services:
  postgres:
    # Pinned to 17: the 18 images moved PGDATA, which would silently orphan an
    # existing volume on upgrade.
    image: postgres:17-alpine
    environment: *postgres-credentials
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Published so a developer can psql in, and so host-run tests can reach it.
    # 5433 by default, not 5432: a natively installed Postgres service holds
    # 0.0.0.0:5432 on at least one dev machine, leaving Docker only the IPv6
    # bind -- so localhost:5432 silently reached the wrong server.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # -U/-d, or pg_isready reports on the wrong database.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense_manager}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  db-init:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_manager}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["init"]

  # Idle sidecar holding the db-init image, so the per-scenario e2e reset is a
  # `compose exec` (~0.3s) instead of a `run --rm` (~2s).
  db-tools:
    build:
      context: .
      dockerfile: database/Dockerfile
    command: ["sleep", "infinity"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_manager}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  employee-api:
    build:
      context: .
      dockerfile: employee_app/Dockerfile
    ports:
      - "5000:5000"
    env_file: employee_app/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_manager}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  manager-api:
    build:
      context: .
      dockerfile: manager-app/Dockerfile
    ports:
      - "7001:7001"
    env_file: manager-app/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-expense_manager}
      DB_USER: ${POSTGRES_USER:-expense}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - employee-api
      - manager-api
    restart: unless-stopped

volumes:
  postgres-data:
